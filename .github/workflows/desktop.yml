# Builds the desktop installers on each operating system (native modules and the
# platform packaging tools need it). Unsigned until certificates are configured.
# Tags v* attach the installers to the GitHub release.
name: Desktop installers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths: ['apps/desktop/**', 'packages/protocol/**', 'pnpm-lock.yaml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux AppImage deb
          - os: windows-latest
            target: --win nsis
          - os: macos-latest
            target: --mac dmg zip --universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @houston/desktop test
      - name: Use the tag as version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: apps/desktop
        shell: bash
        run: npm pkg set version="${GITHUB_REF_NAME#v}"
      - name: Build installers
        working-directory: apps/desktop
        run: node build.mjs && npx electron-builder ${{ matrix.target }} --publish never
        env:
          # No signing yet; see README.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: houston-desktop-${{ matrix.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
