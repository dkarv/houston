<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
      body { border: 6px solid rgba(76, 194, 106, 0.9); box-sizing: border-box; }
      #pointer {
        position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px;
        border-radius: 50%; border: 6px solid #ff5a1f; background: rgba(255, 90, 31, 0.25);
        box-shadow: 0 0 0 3px white; display: none; transition: left 60ms linear, top 60ms linear;
      }
      .ripple {
        position: absolute; width: 24px; height: 24px; margin: -12px 0 0 -12px; border-radius: 50%;
        border: 5px solid #ff5a1f; animation: ripple 900ms ease-out forwards; pointer-events: none;
      }
      @keyframes ripple {
        from { transform: scale(0.5); opacity: 1; }
        to { transform: scale(4); opacity: 0; }
      }
    </style>
  </head>
  <body>
    <div id="pointer"></div>
    <script src="overlay.js"></script>
  </body>
</html>
